<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Mantenimiento · Maintenance</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f4f1; --card: #fff; --ink: #1b2420; --muted: #5d6862; --line: #d6dad2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121715; --card: #1a201d; --ink: #e6ebe7; --muted: #9aa59f; --line: #2f3833; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: min(460px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: #007aff; margin: 6px auto 16px; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main role="status">
  <div class="spin" aria-hidden="true"></div>
  <h1>Estamos actualizando la aplicación</h1>
  <p>Volverá a estar disponible en unos instantes. Esta página se actualizará sola.</p>
  <p lang="ca">Estem actualitzant l’aplicació. Tornarà a estar disponible d’aquí a uns instants.</p>
  <p lang="en">The app is being updated and will be back in a moment.</p>
</main>
</body>
</html>
