<title>Inventario de equipos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: top bar (sections, language, theme, settings cog, account), then one working view at a time. Settings use a side list of sections beside the content. Asset tags look like printed yellow labels. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --surface-2: #e9ece6; --line: #d6dad2;
  --ink: #1b2420; --muted: #5d6862; --accent: #1f5f4f; --accent-ink: #ffffff;
  --tag: #f2d14b; --tag-ink: #2a2400;
  --ok: #2e7d4f; --ok-bg: #dcefe2; --info: #2c5aa0; --info-bg: #dde7f6;
  --warn: #8a5800; --warn-bg: #f8ebcc; --bad: #b23a2e; --bad-bg: #f7dcd8;
  --mute: #646a66; --mute-bg: #e6e8e4; --scrim: rgba(10, 16, 13, 0.45);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --surface: #1a201d; --surface-2: #232b27; --line: #2f3833;
  --ink: #e6ebe7; --muted: #9aa59f; --accent: #6cc3a8; --accent-ink: #0d1a15;
  --tag: #e6c43f; --tag-ink: #241e00;
  --ok: #7fd19c; --ok-bg: #1d3326; --info: #8fb3ec; --info-bg: #1c2a40;
  --warn: #e7b85a; --warn-bg: #382b12; --bad: #f08b7f; --bad-bg: #3d1d19;
  --mute: #a6ada9; --mute-bg: #2a302d; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1a201d; --surface-2: #232b27; --line: #2f3833;
  --ink: #e6ebe7; --muted: #9aa59f; --accent: #6cc3a8; --accent-ink: #0d1a15;
  --tag: #e6c43f; --tag-ink: #241e00;
  --ok: #7fd19c; --ok-bg: #1d3326; --info: #8fb3ec; --info-bg: #1c2a40;
  --warn: #e7b85a; --warn-bg: #382b12; --bad: #f08b7f; --bad-bg: #3d1d19;
  --mute: #a6ada9; --mute-bg: #2a302d; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand .mark i { width: 14px; height: 9px; border: 2px solid var(--accent-ink); border-radius: 2px; position: relative; }
.brand .mark i::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -5px; height: 2px; background: var(--accent-ink); border-radius: 1px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-weight: 500; }
nav.tabs a:hover { background: var(--surface-2); color: var(--ink); }
nav.tabs a.on { background: var(--surface-2); color: var(--ink); }
.prefs { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; background: var(--bg); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 28px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg svg.i { width: 16px; height: 16px; }
.iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; text-decoration: none; }
.iconbtn:hover { color: var(--ink); background: var(--surface-2); }
.iconbtn.on { color: var(--ink); background: var(--surface-2); border-color: var(--accent); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.menuwrap { position: relative; }
.userbtn { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; padding: 3px 8px 3px 3px; border-radius: 999px; cursor: pointer; text-align: left; }
.userbtn:hover, .userbtn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--line); }
.userbtn .nm { display: grid; line-height: 1.2; }
.userbtn .nm b { font-size: 13px; font-weight: 600; }
.userbtn .nm small { font-size: 11.5px; color: var(--muted); }
@media (max-width: 720px) { .userbtn .nm { display: none; } }
.addbtn { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.addbtn[aria-expanded="true"] { background: var(--surface-2); border-style: solid; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; min-width: 260px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16); }
.menu.left { right: auto; left: 0; }
.menu-head { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; display: grid; }
.menu-head small { color: var(--muted); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; color: var(--ink); text-decoration: none; font-weight: 500; }
.mi:hover { background: var(--surface-2); }
.mi svg.i { color: var(--muted); }
.mi.danger, .mi.danger svg.i { color: var(--bad); }
.mi .txt { display: grid; line-height: 1.3; }
.mi .txt small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.mi-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; }
.mi-row > span { color: var(--muted); font-size: 13px; font-weight: 500; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

main { padding-block: 24px 48px; display: grid; gap: 20px; }
h1 { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.head > div { min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.primary.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.small { padding: 3px 10px; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
.stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
@media (max-width: 420px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: inherit; display: grid; gap: 2px; }
.stat:hover { border-color: var(--accent); }
.stat b { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.tag { font-family: var(--f-mono); font-size: 12px; font-weight: 500; background: var(--tag); color: var(--tag-ink); padding: 1px 6px; border-radius: 3px; white-space: nowrap; letter-spacing: 0.02em; text-decoration: none; display: inline-block; }
a.tag:hover { filter: brightness(0.95); }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
dd.mono, dd .mono { white-space: nowrap; overflow-wrap: normal; }
.muted { color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-uso, .st-tech { background: var(--info-bg); color: var(--info); }
.st-disponible, .st-on { background: var(--ok-bg); color: var(--ok); }
.st-reparacion, .st-abierta, .st-admin { background: var(--warn-bg); color: var(--warn); }
.st-descartado, .st-resuelta, .st-read, .st-off { background: var(--mute-bg); color: var(--mute); }
.st-perdido { background: var(--bad-bg); color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip.yes { background: var(--ok-bg); color: var(--ok); }
.chip.no { background: var(--mute-bg); color: var(--mute); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.w-past { color: var(--bad); font-weight: 600; }
.w-soon { color: var(--warn); font-weight: 600; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar input[type=search] { flex: 1 1 240px; min-width: 0; }
input, select, textarea { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel .tablebox { border: 0; border-radius: 0; margin: 0 -18px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--surface); white-space: nowrap; }
td.act { text-align: right; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td .t2 { display: block; font-size: 12.5px; color: var(--muted); }
.empty { padding: 28px; text-align: center; color: var(--muted); }

.alerts { display: grid; }
.alert { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.alert:first-child { border-top: 0; }
.alert .bar { align-self: stretch; border-radius: 2px; }
.alert .txt { min-width: 0; }
.alert .txt small { display: block; color: var(--muted); }
.alert:hover .txt b { text-decoration: underline; }

.bars { display: grid; gap: 10px; }
.barrow { display: grid; grid-template-columns: 120px 1fr 28px; gap: 10px; align-items: center; font-size: 13.5px; }
.barrow .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.barrow .fill { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.barrow b { text-align: right; font-variant-numeric: tabular-nums; }

.feed { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.feed li { display: grid; grid-template-columns: 90px 1fr; gap: 10px; font-size: 13.5px; }
.feed time { color: var(--muted); font-variant-numeric: tabular-nums; }
.feed .by { color: var(--muted); }

dl.kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 8px 12px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.devhead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.devhead .id { display: grid; gap: 6px; min-width: 0; }
.devhead .id .row { gap: 10px; }
.back { color: var(--muted); text-decoration: none; font-size: 13.5px; }
.back:hover { color: var(--ink); }
.current { border-left: 3px solid var(--accent); padding-left: 12px; display: grid; gap: 2px; }
.current b { font-size: 16px; }
.notice { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 6px; font-weight: 500; }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.info { background: var(--info-bg); color: var(--info); }

/* settings */
.settings { display: grid; grid-template-columns: 230px 1fr; gap: 20px; align-items: start; }
.settings > * { min-width: 0; }
.setnav { display: grid; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
.setgroup { display: grid; gap: 1px; padding: 10px 0 6px; border-top: 1px solid var(--line); }
.setglabel { display: flex; align-items: center; gap: 8px; color: var(--ink); font-family: var(--f-display); font-size: 14.5px; font-weight: 600; padding: 0 8px 6px; }
.setglabel svg.i { width: 26px; height: 26px; padding: 5px; border-radius: 6px; background: var(--surface-2); color: var(--accent); }
.crumb { margin: 0; font-size: 13px; color: var(--muted); }
.crumb a { color: var(--muted); }
.crumb span { margin: 0 4px; }
.setcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
@media (max-width: 420px) { .setcards { grid-template-columns: 1fr; } }
.sethead { display: flex; gap: 12px; align-items: flex-start; }
.sethead svg.i { width: 34px; height: 34px; padding: 7px; border-radius: 8px; background: var(--surface-2); color: var(--accent); }
.setlinks { display: grid; }
.setlinks a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.setlinks a:hover b { text-decoration: underline; }
.setlinks .txt { display: grid; min-width: 0; }
.setlinks .txt small { color: var(--muted); }
.setlinks .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; flex: none; }
.setnav a { text-decoration: none; color: var(--muted); font-size: 13.5px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  margin-left: 20px; padding: 6px 10px 6px 14px; border-left: 2px solid var(--line); border-radius: 0 6px 6px 0; }
.setnav a:hover { background: var(--surface-2); color: var(--ink); }
.setnav a.on { background: var(--accent); color: var(--accent-ink); border-left-color: var(--accent); }
.setnav a span { color: inherit; opacity: 0.7; font-variant-numeric: tabular-nums; font-size: 12px; }
.setnav a.home { margin: 0 0 8px; border-left: 0; border-radius: 6px; padding: 8px; color: var(--ink); font-weight: 600; justify-content: flex-start; }
.setnav a.home svg.i { width: 26px; height: 26px; padding: 5px; border-radius: 6px; background: var(--surface-2); color: var(--accent); }
.setnav a.home.on { background: var(--surface-2); color: var(--ink); }
.setnav a.home.on svg.i { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 760px) {
  .settings { grid-template-columns: 1fr; }
  .setnav { display: none; }
  .setgroup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .setglabel { width: 100%; padding: 0 0 2px; }
  .setnav a { padding: 6px 10px; background: var(--surface); border: 1px solid var(--line); }
  .setnav a.on { box-shadow: none; border-color: var(--accent); }
  .setnav a span { display: none; }
}
.regionform { display: grid; gap: 14px; max-width: 620px; }
.regionform label.check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 14px; }

/* login */
.login { display: grid; place-items: center; padding-block: 40px; }
.login .card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; display: grid; gap: 18px; }
.login form { display: grid; gap: 12px; }
.login label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
.login .err { color: var(--bad); font-weight: 500; margin: 0; }
.demo { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.demo button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.demo button:hover { border-color: var(--accent); }
.demo button small { color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog.small { width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--scrim); }
dialog form { display: grid; gap: 16px; padding: 20px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
.fields label, .regionform label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
.fields label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.fields .sect { grid-column: 1 / -1; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.fields .hint, .regionform .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.selplus { display: flex; gap: 6px; min-width: 0; }
.numunit { display: flex; min-width: 0; }
.numunit input { flex: 1; min-width: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.numunit select { flex: none; border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; background: var(--surface-2); }
.selplus select { flex: 1; min-width: 0; }
.plus { flex: none; width: 36px; border: 1px dashed var(--accent); background: transparent; color: var(--accent); border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.plus:hover { background: var(--surface-2); border-style: solid; }
.plus svg.i { width: 16px; height: 16px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-weight: 500; z-index: 20; }
footer { color: var(--muted); font-size: 12.5px; padding-block: 0 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* sub-fields shown when a part is replaceable, and network cards */
.subfields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0; }
.niclist { display: grid; gap: 10px; }
.nic { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); }

/* theme */
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyUi() {
  const glass = prefs.ui === 'glass';
  if (glass) document.documentElement.setAttribute('data-ui', 'glass'); else document.documentElement.removeAttribute('data-ui');
  // Glass: the add button floats in the bottom-right corner; Classic: it sits next to the tabs
  const w = $('#addWrap'); w.classList.toggle('fab', glass);
  if (glass) document.body.appendChild(w); else $('#tabs').appendChild(w);
  document.querySelectorAll('#uiSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.uiSet === (prefs.ui === 'glass' ? 'glass' : 'classic'))));
}
function applyTheme() {
  const r = document.documentElement;
  if (prefs.theme === 'light' || prefs.theme === 'dark') r.setAttribute('data-theme', prefs.theme);
  else if (hostTheme) r.setAttribute('data-theme', hostTheme);
  else r.removeAttribute('data-theme');
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === prefs.theme)));
}

function softwareToLists(data) {

    if (!x) { x = { id: prefix + Math.random().toString(36).slice(2, 8), nombre: name }; data[coll].push(x); } return x.id; };
  data.devices.forEach(d => {

    if (d.osEdition) { d.osEditionId = pick('winEditions', 'we', d.osEdition); delete d.osEdition; }
    if (d.osDistro) { d.osDistroId = pick('linuxDistros', 'ld', d.osDistro); delete d.osDistro; }

function componentsToLists(data) {

  if (n < 0) return long ? `<span class="w-past">${T('w_expired_on', { d: fmt(d.garantia) })}</span>${ext}` : `<span class="w-past">${T('w_expired')}</span><span class="t2">${fmt(d.garantia)}</span>`;
  if (n <= S.settings.warrantyDays) return `<span class="w-soon">${T('w_soon', { n })}</span>${long ? ` (${fmt(d.garantia)})${ext}` : `<span class="t2">${fmt(d.garantia)}</span>`}`;
  return long ? `${fmt(d.garantia)} <span class="muted">· ${T('w_left', { x: age(today(), d.garantia) })}</span>${ext}` : fmt(d.garantia);
}

let toastT;
const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(msg, ok) {
  const el = $('#toast');
  el.innerHTML = (ok ? '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '<span></span>';
  el.lastChild.textContent = msg;
  el.classList.remove('out'); el.hidden = true; void el.offsetWidth; el.hidden = false;   // restart the entrance
  clearTimeout(toastT);
  toastT = setTimeout(() => { if (!motionOK()) { el.hidden = true; return; } el.classList.add('out'); setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 240); }, 2600);
}
function shake(sel) { const el = typeof sel === 'string' ? $(sel) : sel; if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 520); }
function closeDlg(sel) {
  const d = $(sel); if (!d.open) return;
  if (!motionOK()) { d.close(); return; }
  d.classList.add('closing');
  setTimeout(() => { d.classList.remove('closing'); d.close(); }, 190);
}
/* stagger the new view in, like a sheet of cards settling */
function enter() {
  if (!motionOK()) return;
  const els = [];
  [...view.children].forEach(c => { if (c.matches('.stats, .grid2, .grid3, .setcards, .settings')) els.push(...c.children); else els.push(c); });
  els.slice(0, 14).forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(14px) scale(0.985)' }, { opacity: 1, transform: 'none' }],
    { duration: 560, delay: i * 40, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'backwards' }));
  view.querySelectorAll('.stat b').forEach(b => {
    const end = Number(b.textContent); if (!end) return;
    const t0 = performance.now(), dur = 700;
    const step = now => { const k = Math.min(1, (now - t0) / dur); b.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    b.textContent = '0'; requestAnimationFrame(step);
  });
}
/* sliding highlight behind the active tab (Glass design) */
function moveTabInd() {
  const nav = $('#tabs'); let ind = nav.querySelector('.tabind');
  if (!ind) { ind = document.createElement('span'); ind.className = 'tabind'; nav.prepend(ind); }
  const on = nav.querySelector('a.on');
  nav.classList.toggle('has-ind', !!on);
  if (!on || nav.hidden) { ind.style.opacity = 0; return; }
  ind.style.opacity = 1; ind.style.width = on.offsetWidth + 'px'; ind.style.height = on.offsetHeight + 'px';
  ind.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
  if (!ind.classList.contains('live')) requestAnimationFrame(() => requestAnimationFrame(() => ind.classList.add('live')));
}
/* scrollbar width, so floating buttons can keep an even gap to the window edge */
function measureScrollbar() { document.documentElement.style.setProperty('--sbw', Math.max(0, window.innerWidth - document.documentElement.clientWidth) + 'px'); }
new ResizeObserver(measureScrollbar).observe(document.body);
window.addEventListener('resize', measureScrollbar);
window.addEventListener('resize', () => { const i = $('#tabs .tabind'); if (i) { i.classList.remove('live'); moveTabInd(); } });

function openDialog(title, body, onSubmit, okLabel, danger = false) {
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = body;
  $('#dlgOk').textContent = okLabel || t('save');
  $('#dlgOk').hidden = !onSubmit;
  $('#dlgCancel').textContent = onSubmit ? t('cancel') : t('close');
  $('#dlgOk').className = 'btn primary' + (danger ? ' danger' : '');
  dlgSubmit = onSubmit;

$('#dlgCancel').onclick = () => closeDlg('#dlg');

  const fd = new FormData(e.target);
  const res = dlgSubmit(Object.fromEntries(fd), fd);
  if (res === false) { shake('#dlgForm'); return; }

const opts = (list, sel) => list.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${val === sel ? ' selected' : ''}>${esc(lab)}</option>`; }).join('');
const kopts = (keys, fn, sel) => opts(keys.map(k => [k, fn(k)]), sel);

/* a select with a + button that opens a quick-add form for that list */
function selPlus(kind, name, id, optionsHtml, nested) {
  const sel = `<select name="${name}" id="${id}">${optionsHtml}</select>`;
  if (nested || !can('edit')) return sel;
  return `<div class="selplus">${sel}<button type="button" class="plus" data-quick="${kind}" data-target="${id}" aria-label="${T('plus_aria', { x: t(LISTS[kind].single) })}" title="${T('plus_aria', { x: t(LISTS[kind].single) })}">${PLUS_SVG}</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-quick]');

});
function quickAdd(kind, targetId) {
  const C = LISTS[kind];
  $('#dlg2Title').textContent = t('add_x', { x: t(C.single) });
  $('#dlg2Body').innerHTML = C.form(null, true, 'q');
  $('#dlg2Ok').textContent = t('add'); $('#dlg2Cancel').textContent = t('cancel');
  dlg2Submit = (v, fd) => {
    const r = C.read(v, fd, null); if (!r) return false;
    const item = { id: uid(C.prefix), ...r }; S[C.coll].push(item); save();
    const sel = document.getElementById(targetId);
    if (kind === 'modelos' && targetId === 'f-modelId' && $('#f-typeId')) {
      // the device form lists models by type: switch to the new model's type and select it
      if ($('#f-typeId').value !== item.typeId) { $('#f-typeId').value = item.typeId; $('#f-typeId').dispatchEvent(new Event('change', { bubbles: true })); }
      sel.innerHTML = modelOpts(item.typeId, item.id);
    } else if (kind === 'tarjetas' && sel?.closest('[data-nic]')) {
      const ts = sel.closest('[data-nic]').querySelector('.nic-type');
      if (ts.value !== item.type) { ts.value = item.type; ts.dispatchEvent(new Event('change', { bubbles: true })); }
      sel.innerHTML = nicModelOpts(item.type, item.id);
    } else if (kind === 'linuxver' && targetId === 'f-osVerLinux' && $('#f-osDistro')) {
      if ($('#f-osDistro').value !== item.distroId) $('#f-osDistro').value = item.distroId;
      sel.innerHTML = linuxVerOpts(item.distroId, item.id);
    } else if (sel) { sel.insertAdjacentHTML('beforeend', `<option value="${esc(item.id)}">${esc((C.optLabel || C.label)(item))}</option>`); sel.value = item.id; sel.dispatchEvent(new Event('change', { bubbles: true })); }
    toast(t('added_x', { x: C.label(item) }), true);
  };
  if (kind === 'modelos' && $('#f-typeId') && $('#q-type')) $('#q-type').value = $('#f-typeId').value;
  if (kind === 'linuxver' && $('#f-osDistro')?.value && $('#q-distro')) $('#q-distro').value = $('#f-osDistro').value;
  if (kind === 'tarjetas' && $('#q-type')) { const row = document.getElementById(targetId)?.closest('[data-nic]'); if (row) $('#q-type').value = row.querySelector('.nic-type').value; }
  $('#dlg2').showModal();
  $('#dlg2Body').querySelector('input, select')?.focus();
}

  </div>

    openDialog(t('resolve_title'), `<p class="muted" style="margin:0 0 12px">${esc(tx(i.descripcion))}</p><div class="fields">
      <label>${T('fs_date')}<input type="date" name="resuelta" id="s-fecha" value="${today()}"></label>
      <label>${T('fs_cost', { c: curSym() })}<input type="number" min="0" step="1" name="coste" id="s-coste" value="${esc(i.coste)}"></label>
      <label class="full">${T('fi_parts')}<input name="piezas" id="s-piezas" value="${esc(tx(i.piezas))}"></label></div>`, v => {
      Object.assign(i, { estado: 'resuelta', resuelta: v.resuelta || today(), coste: Number(v.coste) || 0, piezas: tx(i.piezas) === v.piezas ? i.piezas : v.piezas });
      if (d.estado === 'reparacion' && !S.incidents.some(x => x.deviceId === d.id && x.estado === 'abierta')) d.estado = openAsg(d.id) ? 'uso' : 'disponible';
      logEv('log_resolved', { tag: d.tag }, d.id); return t('resolve_done');
    }, t('ok_resolve'));
  },
  estado(id) {
    const d = dev(id), a = openAsg(id);
    const choices = ST.filter(k => k !== d.estado && (k !== 'uso' || a));
    openDialog(t('status_title', { tag: d.tag }), `<div class="fields">
      <label class="full">${T('fc_new')}<select name="estado" id="c-estado">${kopts(choices, st)}</select></label>
      ${a ? `<p class="full muted" style="margin:0">${T('fc_warn', { name: emp(a.employeeId).nombre })}</p>` : ''}
      <div class="sect">${T('sect_disposal')}</div>
      <label>${T('fc_dest')}<select name="metodo" id="c-metodo">${kopts(DISPOSAL, dsp)}</select></label>
      <label>${T('fc_cert')}<input name="cert" id="c-cert" placeholder="BR-2026-0XX"></label>
      <label class="full">${T('fc_reason')}<input name="motivo" id="c-motivo"></label></div>`, v => {
      if (a && ['disponible', 'descartado', 'perdido'].includes(v.estado)) a.hasta = today();
      d.estado = v.estado; d.destino = v.estado === 'descartado' ? v.metodo : (d.destino || ''); if (v.estado === 'descartado') d.wipeCert = v.cert.trim();
      const extra = v.estado === 'descartado' ? t('disc_note', { d: fmt(today()), m: dsp(v.metodo), c: v.cert.trim() }) : '';
      const note = [extra, v.motivo.trim()].filter(Boolean).join(' ');
      if (note) { const prev = tx(d.notas); d.notas = (prev ? prev + '\n' : '') + note; }
      logEv('log_status', { tag: d.tag, st: v.estado, reason: v.motivo.trim() }, d.id); return t('status_done');
    });
  },
  nuevoEmpleado() {
    openDialog(t('new_person'), employeeForm(), v => {
      const r = readEmployee(v); if (!r) return false;
      const e = { id: uid('e'), estado: 'activo', estadoFecha: null, ...r };
      S.employees.push(e); location.hash = 'empleado-' + e.id; return t('person_added', { name: e.nombre });
    }, t('add'));
  },
  editarEmpleado(id) {
    const e = emp(id);
    openDialog(t('edit_person', { name: e.nombre }), employeeForm(e), v => { const r = readEmployee(v); if (!r) return false; Object.assign(e, r); return t('saved'); });
  },
  situacion(id) {
    const e = emp(id), ds = S.assignments.filter(a => a.employeeId === e.id && !a.hasta).map(a => dev(a.deviceId)).filter(Boolean);
    const tags = ds.map(d => d.tag).join(', ');
    openDialog(t('sit_title', { name: e.nombre }), `<div class="fields">
      <label>${T('fs_state')}<select name="estado" id="b-estado">${kopts(EMP_STATES, s => t('es_' + s), empState(e))}</select></label>
      <label id="b-fechawrap">${T('fs_since')}<input type="date" name="fecha" id="b-fecha" value="${esc(e.estadoFecha || today())}"></label>
      ${ds.length ? `<div class="notice full" id="b-pending">${T('fl_pending', { n: ds.length, tags })}</div>` : ''}</div>`, v => {
      const before = empState(e);
      e.estado = v.estado; e.estadoFecha = v.estado === 'activo' ? null : (v.fecha || today());
      if (before !== e.estado) logEv(e.estado === 'salida' ? 'log_left' : e.estado === 'baja' ? 'log_onleave' : 'log_back', { name: e.nombre, tags: e.estado === 'salida' ? tags : '' }, ds[0]?.id);
      return t('sit_done');
    });
    const sync = () => { const s = $('#b-estado').value; $('#b-fechawrap').hidden = s === 'activo'; const p = $('#b-pending'); if (p) p.hidden = s !== 'salida'; };
    $('#b-estado').onchange = sync; sync();
  },

};

$('#resetBtn').onclick = () => openDialog(t('reset'), `<p style="margin:0">${T('reset_body')}</p>`, () => { S = seed(); restoreSession(); applyChrome(); return t('reset_done'); }, t('reset_ok'), true);
function closeMenus() { [['#userBtn', '#userMenu'], ['#addBtn', '#addMenu']].forEach(([b, m]) => { $(m).hidden = true; $(b).setAttribute('aria-expanded', 'false'); }); }
function toggleMenu(b, m) { const open = $(m).hidden; closeMenus(); if (open) { $(m).hidden = false; $(b).setAttribute('aria-expanded', 'true'); $(m).querySelector('.mi')?.focus(); } }
$('#userBtn').onclick = e => { e.stopPropagation(); toggleMenu('#userBtn', '#userMenu'); };
$('#addBtn').onclick = e => { e.stopPropagation(); toggleMenu('#addBtn', '#addMenu'); };
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });
$('#miSettings').addEventListener('click', closeMenus);
$('#addMenu').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (!b) return; closeMenus(); if (!can('edit')) return; b.dataset.add === 'device' ? ACTIONS.nuevoDispositivo() : ACTIONS.nuevoEmpleado(); });
$('#logoutBtn').onclick = () => { closeMenus(); cur = null; prefs.session = null; savePrefs(); applyChrome(); route(); };

/* ================= chrome ================= */
function applyChrome() {
  requestAnimationFrame(() => { const i = $('#tabs .tabind'); if (i) i.classList.remove('live'); moveTabInd(); });
  document.documentElement.lang = lang;
  document.title = t('brand');
  $('#brandName').textContent = t('brand');
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  $('#footNote').textContent = t('foot');
  $('#resetBtn').textContent = t('reset');
  $('#langSeg').setAttribute('aria-label', t('lang_group'));
  $('#themeSeg').setAttribute('aria-label', t('theme_group'));
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.querySelectorAll('#themeSeg button').forEach(b => { const l = t('theme_' + b.dataset.themeSet); b.title = l; b.setAttribute('aria-label', l); });
  document.body.classList.toggle('authed', !!cur);
  $('#tabs').hidden = !cur; $('#userWrap').hidden = !cur; $('#addWrap').hidden = !can('edit'); $('#miSettings').hidden = !can('admin');
  // language + theme live in the account menu once signed in, in the header otherwise
  $(cur ? '#langSlot' : '#prefSlot .row').appendChild($('#langSeg'));
  $(cur ? '#themeSlot' : '#prefSlot .row').appendChild($('#themeSeg'));
  $(cur ? '#uiSlot' : '#prefSlot .row').appendChild($('#uiSeg'));
  $('#mUiLbl').textContent = t('menu_ui'); $('#uiSeg').setAttribute('aria-label', t('menu_ui'));
  $('#prefSlot').hidden = !!cur;
  $('#miSettingsTxt').textContent = t('settings'); $('#logoutTxt').textContent = t('logout');
  $('#mLangLbl').textContent = t('menu_lang'); $('#mThemeLbl').textContent = t('menu_theme');
  $('#userBtn').setAttribute('aria-label', t('account_menu'));
  $('#addBtn').title = t('add_menu'); $('#addBtn').setAttribute('aria-label', t('add_menu'));
  $('#miAddDev').textContent = t('new_device'); $('#miAddDevD').textContent = t('add_device_d');
  $('#miAddPer').textContent = t('new_person'); $('#miAddPerD').textContent = t('add_person_d');
  if (cur) { $('#whoAvatar').textContent = initials(cur.nombre); $('#whoName').textContent = cur.nombre; $('#whoRole').textContent = rl(cur.rol); $('#mName').textContent = cur.nombre; $('#mEmail').textContent = cur.email; }
}
$('#langSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; savePrefs(); applyChrome(); route();
});
$('#uiSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-ui-set]'); if (!b) return;
  prefs.ui = b.dataset.uiSet; prefs.uiChosen = true; savePrefs(); applyUi(); const i = $('#tabs .tabind'); if (i) i.classList.remove('live'); moveTabInd();
});
$('#themeSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-theme-set]'); if (!b) return;
  prefs.theme = b.dataset.themeSet; savePrefs(); applyTheme();
});

/* ================= routing ================= */
const view = $('#view');
view.addEventListener('click', ev => {
  const act = ev.target.closest('[data-act]');
  if (act) { if (can('edit')) ACTIONS[act.dataset.act](act.dataset.id); return; }
  const s = ev.target.closest('[data-set]');
  if (s) { if (can('admin')) SET_ACTIONS[s.dataset.set](s.dataset.list, s.dataset.id); return; }
  const f = ev.target.closest('[data-filter]');
  if (f) { F.estado = f.dataset.filter; F.q = ''; F.dept = ''; F.tipo = ''; }
  if (ev.target.closest('a')) return;
  const go = ev.target.closest('[data-go]');
  if (go) location.hash = go.dataset.go;
});
function route() {
  if (!cur) { renderLogin(); document.querySelectorAll('#tabs a').forEach(a => a.classList.remove('on')); return; }
  const h = location.hash.slice(1) || 'panel';
  const sec = h.startsWith('dispositivo') ? 'dispositivos' : h.startsWith('empleado') ? 'empleados' : h.startsWith('ajustes') ? 'ajustes' : 'panel';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.r === sec));
  if (h === 'dispositivos') {
    view.innerHTML = viewDevices(); drawDeviceRows();
    $('#fq').oninput = e => { F.q = e.target.value; drawDeviceRows(); };
    $('#festado').onchange = e => { F.estado = e.target.value; drawDeviceRows(); };
    $('#fdept').onchange = e => { F.dept = e.target.value; drawDeviceRows(); };
    $('#ftipo').onchange = e => { F.tipo = e.target.value; drawDeviceRows(); };
  } else if (h.startsWith('dispositivo-')) view.innerHTML = viewDevice(h.slice(12));
  else if (h === 'empleados') {
    view.innerHTML = viewEmployees(); drawEmpRows();
    $('#eq').oninput = e => { FE.q = e.target.value; drawEmpRows(); };
    $('#eactivos').onchange = e => { FE.activos = e.target.value; drawEmpRows(); };
  } else if (h.startsWith('empleado-')) view.innerHTML = viewEmployee(h.slice(9));
  else if (sec === 'ajustes') { view.innerHTML = viewSettings(h.slice(8)); bindRegion(); }
  else view.innerHTML = viewPanel();
  requestAnimationFrame(moveTabInd);
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); enter(); });
restoreSession(); applyUi(); applyTheme(); applyChrome(); route(); enter();
</script>
